<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">찬송가 605장 오늘 모여 찬송함은</title>
  <desc id="desc">오늘 모여 찬송함은 1절부터 3절까지의 가사</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfd"/>
      <stop offset="1" stop-color="#fff1f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#71324b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" rx="64" fill="#f5d8e2"/>
  <rect x="48" y="48" width="1104" height="1404" rx="44" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="78" y="78" width="1044" height="1344" rx="32" fill="none" stroke="#dca5b9" stroke-width="3"/>
  <text x="600" y="175" text-anchor="middle" fill="#a74668" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="8">HYMN 605</text>
  <text x="600" y="255" text-anchor="middle" fill="#64243e" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="64" font-weight="700">오늘 모여 찬송함은</text>
  <path d="M350 305H520M680 305H850" stroke="#dca5b9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="305" r="9" fill="#b85d7d"/>

  <g fill="#392a30" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="34">
    <g transform="translate(155 390)">
      <circle cx="33" cy="22" r="33" fill="#a74668"/>
      <text x="33" y="34" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">1</text>
      <text x="95" y="34">
        <tspan x="95" dy="0">오늘 모여 찬송함은 형제 자매 즐거움</tspan>
        <tspan x="95" dy="62">거룩하신 주 뜻대로 혼인 예식 합니다</tspan>
        <tspan x="95" dy="62">신랑 신부 이 두 사람 한 몸 되게 하시고</tspan>
        <tspan x="95" dy="62">온 집안이 하나 되고 한 뜻 되게 하소서</tspan>
      </text>
    </g>

    <path d="M155 710H1045" stroke="#ead0d9" stroke-width="2"/>

    <g transform="translate(155 770)">
      <circle cx="33" cy="22" r="33" fill="#a74668"/>
      <text x="33" y="34" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">2</text>
      <text x="95" y="34">
        <tspan x="95" dy="0">세상에서 사는 동안 한 길 가게 하시고</tspan>
        <tspan x="95" dy="62">맘과 뜻이 하나 되어 주 따르게 하소서</tspan>
        <tspan x="95" dy="62">서로 믿고 존경하며 서로 돕고 사랑해</tspan>
        <tspan x="95" dy="62">고와 낙을 함께하며 승리하게 하소서</tspan>
      </text>
    </g>

    <path d="M155 1090H1045" stroke="#ead0d9" stroke-width="2"/>

    <g transform="translate(155 1150)">
      <circle cx="33" cy="22" r="33" fill="#a74668"/>
      <text x="33" y="34" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">3</text>
      <text x="95" y="34">
        <tspan x="95" dy="0">아버지여 우리들이 기도하고 바람은</tspan>
        <tspan x="95" dy="62">저들 부부 세상에서 해로하게 하소서</tspan>
        <tspan x="95" dy="62">이 두 사람 감화하사 항상 주를 섬기며</tspan>
        <tspan x="95" dy="62">이 세상을 살아갈 때 행복하게 하소서 아멘</tspan>
      </text>
    </g>
  </g>
</svg>
